<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Soft Depth Blue Gradient -->
    <linearGradient id="minimal-progress-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#248DCE" />
      <stop offset="100%" stop-color="#1B71A8" />
    </linearGradient>

    <!-- Fade Gradient for Line -->
    <linearGradient id="line-fade" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Solid #248DCE Base -->
  <rect width="600" height="240" rx="20" fill="url(#minimal-progress-bg)" />

  <!-- Single Minimalist Progress Curve -->
  <path d="M 300 240 C 420 180, 500 120, 620 80" fill="none" stroke="url(#line-fade)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Minimalist End Point Dot -->
  <circle cx="560" cy="100" r="4" fill="#FFFFFF" fill-opacity="0.6" />
</svg>
