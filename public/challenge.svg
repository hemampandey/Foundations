<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Rich #248DCE Surface -->
    <linearGradient id="minimal-mastery-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E7FB8" />
      <stop offset="100%" stop-color="#248DCE" />
    </linearGradient>
  </defs>

  <!-- Solid #248DCE Base -->
  <rect width="600" height="240" rx="20" fill="url(#minimal-mastery-bg)" />

  <!-- Ultra-Minimal Geometric Target Circles (Top-Right) -->
  <g transform="translate(520, 50)" opacity="0.25">
    <circle r="110" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    <circle r="70" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    <circle r="30" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    <circle r="4" fill="#FFFFFF" />
  </g>
</svg>
